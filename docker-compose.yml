services:
  mysql:
    image: mysql:8.4
    container_name: skillhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillhub
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/SkillHub.Api/Dockerfile
    container_name: skillhub-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=skillhub;User=root;Password=root;"
      Seed__ExcelPath: /data/SkillHub_Data.xlsx
    volumes:
      - ./data:/data:ro
    ports:
      - "5100:8080"

  web:
    build:
      context: .
      dockerfile: src/SkillHub.Web/Dockerfile
    container_name: skillhub-web
    # The API applies the migrations and the seed, so the web skips that step.
    depends_on:
      - api
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=skillhub;User=root;Password=root;"
      Database__InitializeOnStartup: "false"
    ports:
      - "5200:8080"

volumes:
  mysql-data:
